[project]
name = "dailyvocchatbot"
version = "0.1.0"
description = "An AI-powered chatbot that sends 5 new vocabulary words daily to users via Email or Telegram."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.1",
    "discord-py>=2.6.4",
    "flask>=3.1.2",
    "pynacl>=1.6.1",
    "python-dotenv>=1.2.1",
    "pytz>=2025.2",
    "requests>=2.32.5",
]
